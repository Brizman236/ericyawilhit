baseURL = "https://ericyawilhit.netlify.app/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "Eric Yawilhit"
theme = "PaperMod"
enableRobotsTXT = true

[params]
  description = "Lab writeups, identity management, PKI, and cloud infrastructure notes."
[params.assets]
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon-96x96.png"
  favicon32x32 = "/favicon-96x96.png"
  apple_touch_icon = "/apple-touch-icon.png"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[languages]
  [languages.fr]
    languageName = "FR"
    weight = 1
    title = "Eric Yawilhit"
    
    [languages.fr.params]
      showtoc = true
      tocopen = false
      ShowPostNavLinks = true
    
    [languages.fr.params.profileMode]
      enabled = true
      title = "Eric Yawilhit"
      subtitle = "Passionné d'infrastructure et de sécurité, je documente ici mes déploiements, architectures de labs et travaux sur la souveraineté numérique"
      imageUrl = "/images/avatar.jpeg"
      imageTitle = "Eric Yawilhit"

    [languages.fr.params.homeInfoParams]
      Title = "Eric Yawilhit"
      Content = "J'apprends, je construis, je documente — PKI pour l'Afrique."

    [[languages.fr.menu.main]]
      name = "Articles"
      url = "/posts/"
      weight = 2
    [[languages.fr.menu.main]]
      name = "À propos"
      url = "/about/"
      weight = 2
    [[languages.fr.menu.main]]
      name = "Tags"
      url = "/tags/"
      weight = 2

    [[languages.fr.params.socialIcons]]
      name = "linkedin"
      url = "https://www.linkedin.com/in/eric-yawilhit"
    [[languages.fr.params.socialIcons]]
      name = "github"
      url = "https://github.com/Brizman236"


  [languages.en]
    languageName = "EN"
    weight = 2
    title = "Eric Yawilhit"
    showtoc = true
    tocopen = true

    [languages.en.params.profileMode]
      enabled = true
      title = "Eric Yawilhit"
      subtitle = "Passionate about infrastructure and security, I document my deployments, lab architectures, and digital sovereignty projects here"
      imageUrl = "/images/avatar-1.webp"
      imageTitle = "Eric Yawilhit"

    [languages.en.params.homeInfoParams]
      Title = "Eric Yawilhit"
      Content = "I learn, I build, I document — PKI for Africa."

    [[languages.en.menu.main]]
      name = "Posts"
      url = "/posts/"
      weight = 2
    [[languages.en.menu.main]]
      name = "About"
      url = "/about/"
      weight = 2
    [[languages.en.menu.main]]
      name = "Tags"
      url = "/tags/"
      weight = 2

    [[languages.en.params.socialIcons]]
      name = "linkedin"
      url = "https://www.linkedin.com/in/eric-yawilhit"
    [[languages.en.params.socialIcons]]
      name = "github"
      url = "https://github.com/Brizman236"